name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@1acf9aba857a8eb512014d7097bfb22b2e751ff8
    with:
      test-jobs: 1

  generated-fixtures:
    name: Fixture integrity and install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e2089cd9628995bf2080cd1515086a891dff34f4
      - name: Check fixture staleness
        run: harn run scripts/check_fixture_staleness.harn
      - name: Generate SDK from pinned Notion fixture
        run: harn run --timeout 2m scripts/regen_demo.harn
      - name: Smoke-test package installation
        run: harn run --no-sandbox scripts/package_install_smoke.harn

  status:
    name: CI status
    if: always()
    needs: [package, generated-fixtures]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          FIXTURE_RESULT: ${{ needs.generated-fixtures.result }}
        run: test "$PACKAGE_RESULT" = success && test "$FIXTURE_RESULT" = success
