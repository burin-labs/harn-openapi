name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@2ef969f35ae0384e786be20d9eb2467edc88e8bd
    with:
      test-jobs: 1

  generated-fixtures:
    name: Fixture integrity and install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@6b541c0b50fb9c5dfab994ecb118ee1ea6004b44
      - name: Check fixture staleness
        run: harn run scripts/check_fixture_staleness.harn
      - name: Generate SDK from pinned Notion fixture
        run: harn run --timeout 5m scripts/regen_demo.harn
      - name: Smoke-test package installation
        run: harn run --no-sandbox scripts/package_install_smoke.harn

  status:
    name: CI status
    if: always()
    needs: [package, generated-fixtures]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@2ef969f35ae0384e786be20d9eb2467edc88e8bd
        with:
          results-json: ${{ toJSON(needs.*.result) }}
