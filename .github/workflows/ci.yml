name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@d77cdcf02cb2215982ea668582f53a73821ee90d
    with:
      test-jobs: 1

  generated-fixtures:
    name: Fixture integrity and install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@43aa340f57dd825d7dbc0daa2e6028b1491b7902
      - name: Check fixture staleness
        run: harn run scripts/check_fixture_staleness.harn
      - name: Generate SDK from pinned Notion fixture
        run: harn run --timeout 5m scripts/regen_demo.harn
      - name: Smoke-test package installation
        run: harn run --no-sandbox scripts/package_install_smoke.harn

  status:
    name: CI status
    if: always()
    needs: [package, generated-fixtures]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@d77cdcf02cb2215982ea668582f53a73821ee90d
        with:
          results-json: ${{ toJSON(needs.*.result) }}
